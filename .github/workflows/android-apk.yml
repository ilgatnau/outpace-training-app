name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Test and build standalone APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default includes the obsolete SDK package "tools".
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set Android build number
        id: version
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const number = Number(process.env.BUILD_NUMBER);
          if (!Number.isInteger(number) || number < 1 || number > 2100000000) {
            throw new Error('Android build number is outside the supported range');
          }
          const config = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+$/.test(config.expo.version)) {
            throw new Error('App version must use major.minor.patch format');
          }
          config.expo.android.versionCode = number;
          fs.writeFileSync('app.json', JSON.stringify(config, null, 2) + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${config.expo.version}\n`);
          JS

      - name: Generate Android project
        run: npx --no-install expo prebuild --platform android --no-install

      # Expo's generated release variant bundles JS and uses the template's
      # development signing key. This is an installable preview, not a store build.
      - name: Build standalone preview APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a,x86_64

      - name: Prepare artifact
        run: |
          mkdir -p artifacts/android
          test -s android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/android/outpace-preview.apk
          cd artifacts/android
          sha256sum outpace-preview.apk > outpace-preview.apk.sha256

      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: outpace-android-preview-${{ github.run_number }}
          path: artifacts/android/
          if-no-files-found: error
          retention-days: 14

      - name: Publish download instructions
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ### Outpace Android preview
          Download **outpace-android-preview** from this run's **Artifacts** section.
          Unzip it and install `outpace-preview.apk` on an Android device.
          A SHA-256 checksum is included. The APK supports ARM64 phones and x86_64 emulators.

          This APK includes its JavaScript bundle and needs no Expo Go, account, or backend.
          It uses a development signing key and is intended for testing, not Google Play distribution.
          SUMMARY

  release:
    name: Publish downloadable APK release
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v${{ needs.build.outputs.version }}-build.${{ github.run_number }}
      SOURCE_SHA: ${{ github.sha }}
      BUILD_NUMBER: ${{ github.run_number }}
      APP_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download APK from this build
        uses: actions/download-artifact@v4
        with:
          name: outpace-android-preview-${{ github.run_number }}
          path: apk

      - name: Verify APK checksum
        working-directory: apk
        run: sha256sum --check outpace-preview.apk.sha256

      - name: Publish preview release
        run: |
          # Rerunning a successful workflow keeps its existing, immutable release.
          if gh release view "$RELEASE_TAG" --json isDraft > release.json 2>/dev/null; then
            if [ "$(jq -r .isDraft release.json)" = false ]; then
              echo "Release $RELEASE_TAG is already published; leaving it unchanged."
              exit 0
            fi
          else
            cat > notes.md <<NOTES
          Download **outpace-preview.apk** directly on your Android phone and open it to install.

          App version: **$APP_VERSION** · Android build number: **$BUILD_NUMBER**
          Source commit: $SOURCE_SHA

          This APK runs without Expo Go or a backend. It is a development-signed preview; the installed app label is Outpace. A SHA-256 checksum is included.
          NOTES
            gh release create "$RELEASE_TAG" \
              --target "$SOURCE_SHA" \
              --title "Outpace $APP_VERSION — Build $BUILD_NUMBER" \
              --draft --prerelease --notes-file notes.md
          fi
          # A failed upload can be retried while the release remains a draft.
          gh release upload "$RELEASE_TAG" \
            apk/outpace-preview.apk apk/outpace-preview.apk.sha256 --clobber
          gh release edit "$RELEASE_TAG" --draft=false

      - name: Add direct APK link to run summary
        run: |
          echo "### Outpace build $BUILD_NUMBER" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download APK](https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/outpace-preview.apk)" >> "$GITHUB_STEP_SUMMARY"
