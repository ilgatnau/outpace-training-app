name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build standalone APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default includes the obsolete SDK package "tools".
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Android project
        run: npx --no-install expo prebuild --platform android --no-install

      # Expo's generated release variant bundles JS and uses the template's
      # development signing key. This is an installable preview, not a store build.
      - name: Build standalone preview APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a,x86_64

      - name: Prepare artifact
        run: |
          mkdir -p artifacts/android
          test -s android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/android/touchline-preview.apk
          cd artifacts/android
          sha256sum touchline-preview.apk > touchline-preview.apk.sha256

      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: touchline-android-preview-${{ github.run_number }}
          path: artifacts/android/
          if-no-files-found: error
          retention-days: 14

      - name: Publish download instructions
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ### Touchline Android preview
          Download **touchline-android-preview** from this run's **Artifacts** section.
          Unzip it and install `touchline-preview.apk` on an Android device.
          A SHA-256 checksum is included. The APK supports ARM64 phones and x86_64 emulators.

          This APK includes its JavaScript bundle and needs no Expo Go, account, or backend.
          It uses a development signing key and is intended for testing, not Google Play distribution.
          SUMMARY
